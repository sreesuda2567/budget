<div class="container">
  <!-- Original Loading Overlay -->
  <div class="row justify-content-center center-screen" *ngIf="loading && !isCheckingSSO">
    <div class="spinner-border text-primary" role="status" id="loading"></div>
  </div>

  <div class="row justify-content-center mt-5 mx-1">
    <div class="col-xs-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
      <div class="card card-signin box-shadow2 my-5">
        <div class="card-body">
          <img src="assets/images/RUTS.png" class="img-fluid" alt="RUTS Logo" style="max-width: 100%; height: auto;">
          <h5 class="card-title"><b>PLATFORM</b></h5>

          <!-- 1. SSO Status Checking Indicator (สำหรับ Auto-Redirect & Callback) -->
          <div *ngIf="isCheckingSSO" class="text-center py-4 my-2">
            <div class="spinner-border text-primary mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
            <h6 class="fw-bold text-dark">{{ ssoStatusMessage }}</h6>
            <p class="text-muted small mb-3">กำลังตรวจสอบความพร้อมและการเชื่อมต่อ กรุณารอสักครู่...</p>
            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill px-3" 
                    (click)="fallbackToOriginalForm('ยกเลิกการเชื่อมต่อ SSO')">
              <i class="fa fa-times me-1"></i> เข้าสู่ระบบด้วยวิธีปกติ
            </button>
          </div>

          <!-- 2. แจ้งเตือนกรณี SSO ขัดข้อง / Fallback Active -->
          <div *ngIf="ssoError && showLoginForm" class="alert alert-warning border-0 rounded-3 py-2 px-3 small d-flex align-items-center mb-3">
            <i class="fa fa-exclamation-triangle fs-5 text-warning me-2"></i>
            <div>
              <strong>แจ้งเตือน:</strong> {{ ssoErrorMessage }}
            </div>
          </div>

          <!-- 3. ปุ่ม RUTS SSO (แสดงเมื่อ SSO เปิดใช้งาน และไม่ใช่โหมด Auto-Redirect ที่กำลังโหลด) -->
          <div *ngIf="ssoSettings.sso_enabled && showLoginForm" class="mb-3">
            <button type="button" class="btn btn-ruts-sso shadow-sm" (click)="loginWithSSO()" [disabled]="isLoggingInSSO">
              <span *ngIf="isLoggingInSSO" class="spinner-border spinner-border-sm me-2" role="status"></span>
              <i *ngIf="!isLoggingInSSO" class="fa fa-key me-2"></i>
              <span>{{ isLoggingInSSO ? 'กำลังนำทางไป RUTS SSO...' : 'เข้าสู่ระบบด้วย RUTS SSO' }}</span>
            </button>

            <!-- Divider เส้นคั่น -->
            <div class="sso-divider my-3">
              <span>หรือ เข้าสู่ระบบด้วย e-Passport เดิม</span>
            </div>
          </div>

          <!-- 4. ฟอร์ม Login เดิม (Username/Password) - คงไว้เหมือนเดิม 100% -->
          <form name="form" (ngSubmit)="f.form.valid && onSubmit()" #f="ngForm" novalidate *ngIf="showLoginForm">

            <!-- username input -->
            <div class="col-lg">
              <label class="txt-card">Username</label>
              <input type="text" id="form2Example3" name="username"
                [ngClass]="username.errors && f.submitted ? 'form-control is-invalid' : 'form-control'"
                [(ngModel)]="form.username" required #username="ngModel" placeholder="Username" />
              <div id="validationServer03Feedback" class="invalid-feedback" *ngIf="username.errors && f.submitted">
                Username is required!
              </div>
              <small id="epassport" class="form-text text-left text-muted" style="font-size:10px;">
                [ ชื่อผู้ใช้ e-Passport ไม่ต้องพิมพ์ @rmutsv.ac.th ]
              </small>
            </div>

            <!-- Password input -->
            <div class="col-lg mt-3">
              <label class="txt-card">Password</label>
              <div style="position: relative;">
                <input [type]="showPassword ? 'text' : 'password'" class="form-control" id="form2Example4"
                  name="password" placeholder="Password" [(ngModel)]="form.password" required />

                <i class="fa" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'" (click)="togglePassword()" 
                   style="position: absolute; top: 50%; right: 10px; transform: translateY(-50%); cursor: pointer; color: gray;">
                </i>
              </div>
            </div>

            <div class="form-group mt-4">
              <div class="d-grid gap-2 text-center">
                <button class="btn btn-primary mb-3"
                  style="font-family: 'Prompt-Regular', sans-serif; font-size: 16px; height: 50px;">
                  <i style="font-size: 20px;" class="fa-solid fa-key"></i>&nbsp;LOGIN
                </button>
              </div>
            </div>

          </form>

        </div>
      </div>
    </div>
  </div>
</div>

<div class="text-center" style="margin-top: -10px;">
  <p class="text-center text-muted">{{this.key?.namev}}</p>
  <span class="text-center text-muted" style="margin-top: -50px;">
    <i class="fa-solid fa-school-lock" style="font-size: 18px;"></i> RUTS@All Rights Reserved.
  </span>
</div>
